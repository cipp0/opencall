name: open call settimanali

on:
  schedule:
    - cron: "0 7 * * 1"  # lunedì 07:00 UTC = 8:00 (inverno) / 9:00 (estate) a Vienna
  workflow_dispatch:     # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write  # per salvare opencall.db
  pages: write
  id-token: write

concurrency: opencall

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le call e manda il riepilogo su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" python3 opencall.py --telegram

      - name: Salva il database (serve a sapere quali call sono nuove)
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add opencall.db
          git commit -m "call aggiornate $(date +%F)" || echo "nessuna novità"
          git push

      - run: mkdir site && cp opencall.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
