name: open call

on:
  schedule:
    - cron: "0 5 * * *"  # ogni giorno 05:00 UTC = 6:00 (inverno) / 7:00 (estate) a Vienna
  workflow_dispatch:     # pulsante "Run workflow": lancio a mano, manda anche il Telegram

permissions:
  contents: write  # per salvare opencall.db
  pages: write
  id-token: write

concurrency: opencall

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le call (Telegram solo il lunedì o a mano)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          if [ "$(date +%u)" = 1 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 opencall.py --telegram
          else
            python3 opencall.py
          fi

      - name: Salva il database (serve a sapere quali call sono nuove)
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add opencall.db
          git commit -m "call aggiornate $(date +%F)" || echo "nessuna novità"
          git push

      - run: mkdir site && cp opencall.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
